name: "CodeQL Configuration"

# Specify the query suites and libraries to use
queries:
  - uses: security-and-quality

# Specify which languages to analyze
languages:
  - python

# Disable C/C++ analysis as this is a Python-only project
disable-default-queries: false

# Path patterns to exclude from analysis
paths-ignore:
  - node_modules
  - tests
  - docs
