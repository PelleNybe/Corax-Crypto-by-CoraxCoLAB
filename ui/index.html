<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Corax Crypto - Quantum Command Center</title>
<link href="/static/style.css" rel="stylesheet"/>
<!-- Include Three.js -->
<script nonce="{{ nonce }}" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Include Lightweight Charts -->
<script nonce="{{ nonce }}" src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style nonce="{{ nonce }}">
.auto-style-0 { display: none; }
.auto-style-1 { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border); margin-bottom: 15px; padding-bottom: 8px; }
.auto-style-2 { border: none; margin: 0; padding: 0; }
.auto-style-3 { font-size: 0.75rem; color: rgba(0, 255, 204, 0.6); }
.auto-style-4 { margin-top: 15px; }
.auto-style-5 { font-size: 0.6rem; color: rgba(255,255,255,0.3); text-align: right; margin-top: 5px; }
.auto-style-6 { color: inherit; text-decoration: none; }
.auto-style-7 { color: inherit; text-decoration: none; }
.auto-style-8 { margin-top: 15px; }
.auto-style-9 { display: flex; flex-direction: column; gap: 2px; margin-bottom: 5px; }
.auto-style-10 { height: 1px; background: rgba(255,255,255,0.2); margin: 5px 0; }
.auto-style-11 { display: flex; flex-direction: column; gap: 2px; }
.auto-style-12 { margin-top: 15px; }
.auto-style-13 { display: flex; flex-direction: column; gap: 10px; }
.auto-style-14 { display: flex; gap: 10px; align-items: center; }
.auto-style-15 { width: 120px; text-transform: uppercase; }
.auto-style-16 { width: 80px; }
.auto-style-17 { display: flex; gap: 10px; margin-top: 5px; }
.auto-style-18 { flex: 1; background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; cursor: pointer; }
.auto-style-19 { flex: 1; background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; padding: 10px; cursor: pointer; }
.auto-style-20 { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 1px solid #ffaa00; padding: 10px; cursor: pointer; width: 100%; }
.auto-style-21 { margin-top: 15px; }
.auto-style-22 { margin-bottom: 15px; }
.auto-style-23 { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 1px solid #ffaa00; padding: 5px 10px; cursor: pointer; }
.auto-style-24 { background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; padding: 5px 10px; cursor: pointer; }
.auto-style-25 { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; padding: 5px 10px; cursor: pointer; font-weight: bold; }
.auto-style-26 { margin-bottom: 15px; border-top: 1px dashed var(--border); padding-top: 10px; }
.auto-style-27 { width: 80px; }
.auto-style-28 { background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; padding: 5px; cursor: pointer; }
.auto-style-29 { margin-bottom: 15px; border-top: 1px dashed var(--border); padding-top: 10px; }
.auto-style-30 { background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; padding: 5px; cursor: pointer; }
.auto-style-31 { border-top: 1px dashed var(--border); padding-top: 10px; }
.auto-style-32 { width: 60px; }
.auto-style-33 { width: 60px; }
.auto-style-34 { background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; padding: 5px; cursor: pointer; }
.auto-style-35 { margin-top: 15px; position: absolute; right: 30px; top: 30px; max-width: 300px; }
.auto-style-36 { color: #ff0055; font-size: 0.9em; text-align: right; margin-bottom: 10px; min-height: 100px; }
.auto-style-37 { border-bottom: 1px dashed var(--border); margin: 5px 0; }
.auto-style-38 { color: #00ffcc; font-size: 0.9em; text-align: right; min-height: 100px; }
.auto-style-39 { margin-top: 15px; }
.auto-style-40 { width: 100%; height: 300px; }
.auto-style-41 { margin-top: 15px; }
.auto-style-42 { position: absolute; bottom: 30px; right: 30px; padding: 10px; }
.auto-style-43 { background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; padding: 8px 15px; cursor: pointer; }
</style></head>
<body>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="alert-overlay"></div>
<div id="toast-container"></div>
<div id="webgl-container"></div>
<div id="connection-status">INITIALIZING QUANTUM LINK...</div>
<div class="auto-style-0" id="hud">
<div class="panel">
<div class="auto-style-1">
<h1 class="auto-style-2">Corax Telemetry</h1>
<span class="auto-style-3" id="val-last-updated">SYNCING...</span>
</div>
<div class="metric">
<span>System Mode:</span>
<span class="mode-indicator mode-DRY_RUN" id="val-mode">DRY RUN</span>
</div>
<div class="metric"><span>Ledger Balance:</span> <span class="value" id="val-balance">$---</span></div>
<div class="metric"><span>API Latency:</span> <span class="value" id="val-latency">-- ms</span></div>
<div class="metric auto-style-4"><span>Regime:</span> <span class="value" id="val-regime">SCANNING</span></div>
<div class="synthesis-box" id="val-synthesis">
                [COPILOT] Syncing neuro-link...
            </div>
<div class="auto-style-5">
                By <a class="auto-style-6" href="https://github.com/PelleNybe" target="_blank">Pelle Nyberg</a> / <a class="auto-style-7" href="https://coraxcolab.com" target="_blank">Corax CoLAB</a>
</div>
</div>
<!-- L2 Depth Overlay -->
<div class="panel auto-style-8" id="depth-panel">
<h1>L2 Depth (BTC)</h1>
<div class="auto-style-9" id="depth-asks">
</div>
<div class="auto-style-10"></div>
<div class="auto-style-11" id="depth-bids">
</div>
</div>
<!-- Manual Trading Overlay -->
<div class="panel auto-style-12" id="trading-panel">
<h1>Manual Override</h1>
<div class="trade-controls auto-style-13">
<div class="auto-style-14">
<input class="auto-style-15" id="trade-symbol" placeholder="Symbol" type="text" value="BTC/USDT"/>
<input class="auto-style-16" id="trade-size" min="0.001" placeholder="Size" step="0.01" type="number" value="0.01"/>
</div>
<div class="auto-style-17">
<button class="auto-style-18" id="btn-buy">BUY</button>
<button class="auto-style-19" id="btn-sell">SELL</button>
</div>
<button class="auto-style-20" id="btn-cancel">CANCEL ALL</button>
</div>
</div>
<!-- Admin & Settings Overlay -->
<div class="panel auto-style-21" id="admin-panel">
<h1>Engine Control</h1>
<div class="trade-controls auto-style-22">
<button class="auto-style-23" id="btn-pause">PAUSE</button>
<button class="auto-style-24" id="btn-resume">RESUME</button>
<button class="auto-style-25" id="btn-kill">KILL SWITCH</button>
</div>
<div class="auto-style-26">
<label>Set Balance:</label>
<input class="auto-style-27" id="input-balance" type="number" value="10000"/>
<button class="auto-style-28" id="btn-set-balance">Set</button>
</div>
<div class="auto-style-29">
<label>Strategy:</label>
<select id="select-strategy">
<option value="StatisticalArbitrage">Statistical Arb</option>
<option value="SmaCrossover">SMA Crossover</option>
<option value="FundingRateArb">Funding Rate Arb</option>
<option value="OrderbookImbalance">Orderbook Imbalance</option>
</select>
<button class="auto-style-30" id="btn-set-strategy">Load</button>
</div>
<div class="auto-style-31">
<label>Max Risk/Trade %:</label>
<input class="auto-style-32" id="input-risk" step="0.005" type="number" value="0.01"/>
<label>Max DD %:</label>
<input class="auto-style-33" id="input-dd" step="0.01" type="number" value="0.05"/>
<button class="auto-style-34" id="btn-update-settings">Save</button>
</div>
</div>
<!-- Order Book Overlay -->
<div class="panel auto-style-35" id="orderbook-panel">
<h1>L2 Order Book</h1>
<div class="auto-style-36" id="ob-asks">Waiting for data...</div>
<div class="auto-style-37"></div>
<div class="auto-style-38" id="ob-bids"></div>
</div>
<!-- TradingView Chart Overlay -->
<div class="panel auto-style-39">
<div class="auto-style-40" id="tvchart"></div>
</div>
<div class="panel auto-style-41" id="log-panel">
<!-- Logs appear here -->
</div>
<div class="panel auto-style-42">
<button class="auto-style-43" id="btn-toggle-view">TOGGLE VIEW: CITY</button>
</div>
</div>
<script nonce="{{ nonce }}" src="/static/app.js"></script>
</body>
</html>
