[tool.poetry]
package-mode = false
packages = [{include = "core"}, {include = "data_engine"}, {include = "execution"}, {include = "intelligence"}, {include = "schemas"}, {include = "ui"}]

name = "corax-crypto"
version = "0.1.0"
description = "Next-generation HFT platform with async operations and Edge AI."
authors = ["Corax CoLAB"]
license = "GPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
transformers = "^4.40.0"
torch = "^2.2.0"
python = ">=3.10,<3.15"
polars = "^0.20.10"
pyarrow = "^15.0.0"
websockets = "^12.0"
ccxt = "^4.2.14"
pydantic = "^2.6.3"
motor = "^3.3.2"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
numpy = "<2.0.0"
pydantic-settings = "^2.14.0"
loguru = "^0.7.3"
aiogram = "^3.27.0"
web3 = "^7.15.0"
requests = "^2.34.2"
cryptography = "^48.0.0"
jinja2 = "^3.1.6"
beautifulsoup4 = "^4.14.3"
aiohttp = "^3.13.5"
python-dotenv = "^1.2.2"
psutil = "^7.2.2"
aiofiles = "^25.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=24.1.0,<25.0.0)",
    "isort (>=5.13.0,<6.0.0)",
    "flake8 (>=7.0.0,<8.0.0)",
    "mypy (>=1.8.0,<2.0.0)",
    "bandit (>=1.7.5,<2.0.0)",
    "interrogate (>=1.5.0,<2.0.0)",
    "ruff (>=0.1.8,<1.0.0)"
]
test = [
    "httpx (>=0.28.1,<0.29.0)",
    "aiofiles (>=25.1.0,<26.0.0)"
]

# Tool configurations
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.github
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | env
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["core", "data_engine", "execution", "intelligence", "schemas", "ui"]
extend_skip = [".venv", "venv", "env", ".git", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "asyncio: Async tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
branch = true
source = ["core", "data_engine", "execution", "intelligence", "schemas", "ui"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod"
]
precision = 2
show_missing = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_optional = true
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "env", "build", "dist"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",      # pycodestyle
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long
    "E203",   # Whitespace before ':'
    "W503",   # Line break before binary operator
]
exclude = [
    ".venv",
    "venv",
    "env",
    ".git",
    ".github",
    "__pycache__",
    "build",
    "dist",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "env", "build", "dist"]
skips = ["B101"]  # Skip assert_used in tests
