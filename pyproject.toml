[tool.poetry]
package-mode = false
packages = [{include = "core"}, {include = "data_engine"}, {include = "execution"}, {include = "intelligence"}, {include = "schemas"}, {include = "ui"}]

name = "corax-crypto"
version = "0.1.0"
description = "Next-generation HFT platform with async operations and Edge AI."
authors = ["Corax CoLAB"]
license = "GPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
transformers = "^4.40.0"
torch = "^2.2.0"
python = ">=3.10,<3.15"
polars = "^0.20.10"
pyarrow = "^15.0.0"
websockets = "^12.0"
ccxt = "^4.2.14"
pydantic = "^2.6.3"
motor = "^3.3.2"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
numpy = "<2.0.0"
pydantic-settings = "^2.14.0"
loguru = "^0.7.3"
aiogram = "^3.27.0"
web3 = "^7.15.0"
requests = "^2.34.2"
cryptography = "^48.0.0"
jinja2 = "^3.1.6"
beautifulsoup4 = "^4.14.3"
aiohttp = "^3.13.5"
python-dotenv = "^1.2.2"
psutil = "^7.2.2"
aiofiles = "^25.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
test = [
    "httpx (>=0.28.1,<0.29.0)",
    "aiofiles (>=25.1.0,<26.0.0)"
]
